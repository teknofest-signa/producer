spring:
  application:
    name: producer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teknofest}
    username: ${DB_USERNAME:teknofest}
    password: ${DB_PASSWORD:teknofest}

    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml

  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 1MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${NO_REPLY_EMAIL}
    password: ${NO_REPLY_EMAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:9090}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:qYrUvRZbMm1gxAVfVG8KtJPqfLf3A2qkwo0U7cqDC+HqU0ZVOz+N4VkkFqaQoxlc}
      access-token:
        expiration: ${ACCESS_TOKEN_EXPIRATION:36000000}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
